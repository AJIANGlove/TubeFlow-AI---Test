[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "tubeflow-ai-test-backend"
version = "0.1.0"
description = "TubeFlow AI Test backend control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "minio==7.2.20",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pycryptodome>=3.23,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "temporalio>=1.18,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
tubeflow-test-api = "tubeflow_test.api.app:run"
tubeflow-test-worker = "tubeflow_test.workflows.worker:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tubeflow_test*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires explicitly configured local dependencies",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tubeflow_test"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tubeflow_test"]
mypy_path = "src"
